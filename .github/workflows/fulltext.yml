name: Capture full-text article

on:
  workflow_dispatch:
    inputs:
      articles:
        description: Article metadata as a JSON array
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fulltext-publish
  cancel-in-progress: false
  queue: max

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=dev
      - run: npx playwright install --with-deps chromium
      - name: Capture and publish article
        env:
          ARTICLE_INPUT: ${{ inputs.articles }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          PUBLISH_SECRET: ${{ secrets.PUBLISH_SECRET }}
        run: node scripts/capture.mjs
      - name: Keep capture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-${{ github.run_id }}
          path: artifacts/
          retention-days: 3
          if-no-files-found: ignore
